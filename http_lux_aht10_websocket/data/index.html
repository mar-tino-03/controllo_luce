<!DOCTYPE HTML>
<html lang="it">
<head>
  <title>ESP Web Server</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/style.css" rel="stylesheet" type="text/css">
  <link rel="icon" href="data:,">

</head>
<body>
  <div class="topnav">
    <h1>ESP WebSocket Server</h1>
  </div>
  <div class="content">
    <div class="card">
      <h2>Output - GPIO 2</h2>
      <p class="state">temperatura: <span id="tmp">0</span></p>
      <p class="state">umidità: <span id="hum">0</span></p>
      <p class="state">volt batteria: <span id="bat">0</span></p>
      <p class="state">foto resistenza: <span id="lux">0</span></p>
      <p class="state">state: <span id="state">OFF</span></p>
      <p><button id="button" class="button">Toggle</button></p>
    </div>
  </div>
<script>
  var gateway = `ws://${window.location.hostname}/ws`;
  var websocket;
  window.addEventListener('load', onLoad);
  function initWebSocket() {
    console.log('Trying to open a WebSocket connection...');
    websocket = new WebSocket(gateway);
    websocket.onopen    = onOpen;
    websocket.onclose   = onClose;
    websocket.onmessage = onMessage; // <-- add this line
  }
  function onOpen(event) {
    console.log('Connection opened');
  }
  function onClose(event) {
    console.log('Connection closed');
    setTimeout(initWebSocket, 2000);
  }
  function onMessage(event) {
    var msg = JSON.parse(event.data);
    var state;
    if (msg.led == "1"){
      state = "ON";
    }
    else{
      state = "OFF";
    }

    document.getElementById('hum').innerHTML = msg.hum;
    document.getElementById('tmp').innerHTML = msg.tmp;
    document.getElementById('lux').innerHTML = msg.lux;
    document.getElementById('bat').innerHTML = msg.bat;
    document.getElementById('state').innerHTML = state;
  }
  function onLoad(event) {
    initWebSocket();
    initButton();
  }
  function initButton() {
    document.getElementById('button').addEventListener('click', toggle);
  }
  function toggle(){
    websocket.send('toggle');
  }
</script>
</body>
</html>
